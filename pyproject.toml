[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "foriscope"
version = "0.1.0"
description = "A verified black-box explainer for web/API systems: every claim probe-backed or reason-coded refused, with a coverage ledger and a signed clean-room audit log."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Ranadhir Ghosh" }]
keywords = ["api", "black-box", "verification", "documentation", "audit", "openapi"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.scripts]
foriscope = "foriscope.cli:main"

[tool.setuptools]
packages = ["foriscope"]
